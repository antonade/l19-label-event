name: apply
on: workflow_dispatch
permissions:
  issues: write
jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.addLabels({owner: context.repo.owner, repo: context.repo.repo, issue_number: 1, labels: ['control-label']});
